<!-- Miga-Photobook — نسخة Vector حقيقية (مش صورة نقطية مُضمّنة) لأيقونة
     الكتاب+الكاميرا الذهبية. المسار (path) اتولّد بتتبّع حقيقي (potrace)
     لشكل اللوجو اللي بعته ماجدي، بعد تحويله لصورة تباين عالي (أبيض/أسود)
     ثم تتبّعه لمسارات SVG فعلية — مش صورة PNG متحطة جوه إطار SVG زي المحاولة
     الأولى. الدرجة الذهبية والتوهج اتضافوا بـSVG gradient/filter حقيقيين
     فوق نفس المسار، عشان يقرب من إحساس الصورة الأصلية المجسّمة وهو لسه
     Vector 100% قابل للتكبير بلا فقدان جودة. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 531" width="531" height="531">
  <defs>
    <radialGradient id="bgGlow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8b64a" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#e8b64a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#131316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetal" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#e8b64a"/>
      <stop offset="70%" stop-color="#c8992f"/>
      <stop offset="100%" stop-color="#e8b64a"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="531" height="531" fill="#131316"/>
  <rect x="0" y="0" width="531" height="531" fill="url(#bgGlow)"/>

