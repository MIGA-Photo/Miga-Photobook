<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo & Style Library | Miga-Photobook</title>
  <meta name="description" content="Browse all available Miga-Photobook styles and add the ones you want to your cart before checkout.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .catalog-page{max-width:1180px;margin:0 auto;padding:28px 18px 70px}
    .catalog-head{text-align:center;margin-bottom:24px}
    .catalog-head h1{margin:0 0 10px}
    .catalog-head p{margin:0 auto;max-width:760px;opacity:.82;line-height:1.8}
    .catalog-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 28px}
    .catalog-filter{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:inherit;border-radius:999px;padding:9px 15px;cursor:pointer}
    .catalog-filter.active{border-color:var(--brass,#d9a441);color:var(--brass,#d9a441)}
    .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
    .catalog-card{overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.035);box-shadow:0 10px 28px rgba(0,0,0,.14)}
    .catalog-media{aspect-ratio:4/5;background:#17161d;overflow:hidden}
    .catalog-media img{width:100%;height:100%;object-fit:cover;display:block}
    .catalog-body{padding:14px}
    .catalog-title{font-weight:700;line-height:1.45;min-height:42px}
    .catalog-price{margin-top:6px;opacity:.8}
    .catalog-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
    .catalog-actions button,.catalog-actions a{width:100%;box-sizing:border-box;text-align:center}
    .catalog-cart{cursor:pointer}
    .catalog-cart.in-cart{opacity:.72}
    .catalog-status{text-align:center;padding:34px 12px;opacity:.8;grid-column:1/-1}
    .catalog-back{display:inline-block;margin-top:24px}
    @media(max-width:600px){.catalog-page{padding-top:18px}.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.catalog-body{padding:10px}.catalog-title{font-size:14px}.catalog-price{font-size:13px}.catalog-actions{margin-top:9px}}
  </style>
</head>
<body class="catalog-page">
  <main>
    <header class="catalog-head">
      <a href="/" class="brand" style="display:inline-block;margin-bottom:18px">Miga-Photobook</a>
      <h1>Photo & Style Library</h1>
      <p>Browse the available styles, preview any result, or click <strong>Add to cart</strong> to save your choices before checkout.</p>
    </header>
    <nav class="catalog-tools" id="filters" aria-label="Filter by category"></nav>
    <section id="catalogGrid" class="catalog-grid" aria-live="polite">
      <div class="catalog-status">Loading styles…</div>
    </section>
    <a href="/" class="catalog-back">← Back to homepage</a>
  </main>
<script>
(function(){
  'use strict';
  var API='https://miga-photobook-api.magdyfarouk380.workers.dev';
  var grid=document.getElementById('catalogGrid');
  var filters=document.getElementById('filters');
  var products=[];
  var selected='all';
  var cats={all:'All',children:'Children',male:'Men',female:'Women',business:'Business',cinematic:'Cinematic',luxury:'Luxury',artistic:'Artistic',magazine:'Magazine'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function cart(){try{var x=JSON.parse(localStorage.getItem('megaPromptCart'));return Array.isArray(x)?x:[]}catch(e){return[]}}
  function saveCart(x){try{localStorage.setItem('megaPromptCart',JSON.stringify(x))}catch(e){}}
  function authHeader(){var t=localStorage.getItem('megaPromptAuthToken');return t?{'Authorization':'Bearer '+t}:{}}
  function syncServer(id,add){var token=localStorage.getItem('megaPromptAuthToken');if(!token)return;fetch(API+(add?'/account/cart/add':'/account/cart/remove'),{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),body:JSON.stringify({productId:id})}).catch(function(){});}
  function toggleCart(id){var c=cart(),i=c.indexOf(id),add=i===-1;if(add)c.unshift(id);else c.splice(i,1);saveCart(c);syncServer(id,add);render();}
  window.toggleCatalogCart=toggleCart;
  function renderFilters(){
    var used={all:true};products.forEach(function(p){if(p.category)used[p.category]=true});
    filters.innerHTML=Object.keys(cats).filter(function(k){return used[k]}).map(function(k){return '<button type="button" class="catalog-filter'+(selected===k?' active':'')+'" data-cat="'+k+'">'+cats[k]+'</button>';}).join('');
    filters.querySelectorAll('button').forEach(function(b){b.onclick=function(){selected=b.dataset.cat;renderFilters();render()}});
  }
  function render(){
    var c=cart(),items=selected==='all'?products:products.filter(function(p){return p.category===selected});
    if(!items.length){grid.innerHTML='<div class="catalog-status">No styles are currently available in this section.</div>';return;}
    grid.innerHTML=items.map(function(p){
      var inCart=c.indexOf(p.id)!==-1;
      var title=p.titleEn||p.title||'';
      return '<article class="catalog-card">'
        +'<a href="/#product='+encodeURIComponent(p.id)+'" aria-label="Choose '+esc(title)+'"><div class="catalog-media"><img src="'+esc(p.image||'')+'" alt="'+esc(title)+'" loading="lazy" decoding="async"></div></a>'
        +'<div class="catalog-body"><div class="catalog-title">'+esc(title)+'</div>'
        +(Number(p.price)>0?'<div class="catalog-price">'+esc(p.price)+' جنيه</div>':'')
        +'<div class="catalog-actions"><button type="button" class="buy-btn catalog-cart'+(inCart?' in-cart':'')+'" onclick="toggleCatalogCart(\''+esc(p.id).replace(/'/g,"\\'")+'\')">'+(inCart?'Remove from cart':'Add to cart')+'</button>'
        +'<a class="btn-ghost" href="/#product='+encodeURIComponent(p.id)+'">Choose style</a></div></div></article>';
    }).join('');
  }
  fetch(API+'/products',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
    try{products=JSON.parse(d.value||'[]')}catch(e){products=[]}
    products=Array.isArray(products)?products.filter(function(p){return p&&p.id&&p.image}):[];
    products.sort(function(a,b){return (a.order||0)-(b.order||0)});
    renderFilters();render();
  }).catch(function(){grid.innerHTML='<div class="catalog-status">Could not load the library right now. Please refresh in a moment.</div>';});
})();
</script>
</body>
</html>
